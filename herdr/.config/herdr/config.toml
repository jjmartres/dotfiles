# Herdr configuration — aligned with Ghostty & Catppuccin
# Placed at ~/.config/herdr/config.toml via Stow

onboarding = false

[theme]
# Built-in base theme: catppuccin
name = "catppuccin"

# Follow macOS / Ghostty appearance (Macchiato for dark, Latte for light)
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[theme.custom]
# Catppuccin Macchiato palette overrides aligned with Ghostty
sidebar_bg = "#181926"       # Crust — contraste net avec les panes
active_row_bg = "#363a4f"    # Surface0
selection_bg = "#494d64"     # Surface1
surface0 = "#363a4f"         # Surface0 (séparateurs de zone)
surface1 = "#5b6078"         # Surface2 (démarcation plus nette)
surface_dim = "#181926"      # Crust
overlay0 = "#8087a2"         # Overlay1 (séparateur horizontal spaces/agents & bordures inactives nets)
overlay1 = "#939ab7"         # Overlay2
panel_bg = "reset"           # Inherits outer Ghostty background and blur
accent = "#b7bdf8"           # Ghostty split-divider-color (Macchiato lavender)
red = "#ed8796"              # Macchiato red
green = "#a6da95"            # Macchiato green

[theme.custom.dark]
sidebar_bg = "#181926"       # Crust
panel_bg = "#24273a"         # Macchiato base
text = "#cad3f5"             # Macchiato text
accent = "#b7bdf8"           # Macchiato lavender
overlay0 = "#8087a2"         # Séparateur spaces/agents contrasté

[theme.custom.light]
sidebar_bg = "#e6e9ef"       # Latte mantle
panel_bg = "#eff1f5"         # Latte base
text = "#4c4f69"             # Latte text
accent = "#7287fd"           # Latte lavender
overlay0 = "#8c8fa1"         # Séparateur spaces/agents Latte contrasté

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "auto"
new_cwd = "follow"
kitty_graphics = true

[ui]
# Accent color matching Ghostty split-divider-color (#b7bdf8)
accent = "#b7bdf8"

# Sidebar presentation
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"

# Mouse and cursor aligned with Ghostty
mouse_capture = true
copy_on_select = true
mouse_scroll_lines = 2
host_cursor = "native"

# Split panes & borders aligned with Ghostty
pane_borders = "always"
pane_outer_borders = true
pane_scrollbars = false
pane_gaps = true
show_agent_labels_on_pane_borders = true

# Tabs & title
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
status_indicators = "dots"
window_title = "{hostname}: {workspace}"

# Top bar right status
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" }
]
tab_bar_right_separator = "  "

# Expanded spaces rows in sidebar
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# Expanded agent rows in sidebar: displays agent name and active session/task
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#b7bdf8", bold = true }, "terminal_title_stripped"]
]

[ui.toast]
delivery = "terminal"

# Sounds on agent state change (done / blocked / attention)
[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+b"

# Window / split navigation aligned with Ghostty & Vim
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
zoom = "prefix+z"
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Modal popups
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
width = "85%"
height = "85%"

[experimental]
pane_history = true
