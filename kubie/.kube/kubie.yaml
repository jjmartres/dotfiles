# Force kubie to use fish shell
shell: fish

# Neovim as default editor for kubie edit / kubie edit-config
default_editor: nvim

# Configure where to look for Kubernetes config files
configs:
  include:
    - ~/.kube/config
    - ~/.kube/*.yml
    - ~/.kube/*.yaml
    - ~/.kube/configs/*.yml
    - ~/.kube/configs/*.yaml
    - ~/.kube/kubie/*.yml
    - ~/.kube/kubie/*.yaml
  exclude:
    - ~/.kube/kubie.yaml

# Prompt settings
# Disable kubie's custom prompt because Starship prompt already displays Kubernetes context/namespace
prompt:
  disable: true
  show_depth: true

# Behavior
behavior:
  validate_namespaces: true
  print_context_in_exec: auto

# Skim / fzf menu display options
fzf:
  mouse: true
  reverse: true
  height: "50%"
