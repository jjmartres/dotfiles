# Catppuccin Mocha — Television Theme
# https://catppuccin.com/palette
#
# Palette reference:
#   base      #1e1e2e  mantle   #181825  crust    #11111b
#   surface0  #313244  surface1 #45475a  surface2 #585b70
#   overlay0  #6c7086  overlay1 #7f849c  overlay2 #9399b2
#   subtext0  #a6adc8  subtext1 #bac2de  text     #cdd6f4
#   lavender  #b4befe  blue     #89b4fa  sapphire #74c7ec
#   sky       #89dceb  teal     #94e2d5  green    #a6e3a1
#   yellow    #f9e2af  peach    #fab387  maroon   #eba0ac
#   red       #f38ba8  mauve    #cba6f7  pink     #f5c2e7
#   flamingo  #f2cdcd  rosewater #f5e0dc

# ── General ──────────────────────────────────────────────────────────────────
background    = '#1e1e2e'  # base
border_fg     = '#45475a'  # surface1
text_fg       = '#cdd6f4'  # text
dimmed_text_fg = '#6c7086' # overlay0

# ── Input ─────────────────────────────────────────────────────────────────────
input_text_fg  = '#cba6f7'  # mauve  — typed query
result_count_fg = '#fab387' # peach  — "42 / 1337" counter

# ── Results ───────────────────────────────────────────────────────────────────
result_name_fg        = '#89b4fa'  # blue      — file/item name
result_line_number_fg = '#f9e2af'  # yellow    — line numbers
result_value_fg       = '#cdd6f4'  # text      — value column
selection_fg          = '#cdd6f4'  # text      — selected row fg
selection_bg          = '#313244'  # surface0  — selected row bg
match_fg              = '#f38ba8'  # red       — fuzzy match highlights

# ── Preview ───────────────────────────────────────────────────────────────────
preview_title_fg = '#94e2d5'  # teal

# ── Mode pills ────────────────────────────────────────────────────────────────
channel_mode_fg         = '#1e1e2e'  # base    (text on pill)
channel_mode_bg         = '#cba6f7'  # mauve   (pill background)
remote_control_mode_fg  = '#1e1e2e'  # base
remote_control_mode_bg  = '#a6e3a1'  # green
send_to_channel_mode_fg = '#89dceb'  # sky
