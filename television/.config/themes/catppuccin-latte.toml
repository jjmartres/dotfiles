# Catppuccin Latte — Television Theme
# https://catppuccin.com/palette
#
# Latte is the light variant — base is near-white, accents are vivid.
#
# Palette reference:
#   base      #eff1f5  mantle   #e6e9ef  crust    #dce0e8
#   surface0  #ccd0da  surface1 #bcc0cc  surface2 #acb0be
#   overlay0  #9ca0b0  overlay1 #8c8fa1  overlay2 #7c7f93
#   subtext0  #6c6f85  subtext1 #5c5f77  text     #4c4f69
#   lavender  #7287fd  blue     #1e66f5  sapphire #209fb5
#   sky       #04a5e5  teal     #179299  green    #40a02b
#   yellow    #df8e1d  peach    #fe640b  maroon   #e64553
#   red       #d20f39  mauve    #8839ef  pink     #ea76cb
#   flamingo  #dd7878  rosewater #dc8a78

# ── General ──────────────────────────────────────────────────────────────────
background     = '#eff1f5'  # base      (light background)
border_fg      = '#bcc0cc'  # surface1
text_fg        = '#4c4f69'  # text      (dark on light)
dimmed_text_fg = '#9ca0b0'  # overlay0

# ── Input ─────────────────────────────────────────────────────────────────────
input_text_fg   = '#8839ef'  # mauve
result_count_fg = '#fe640b'  # peach

# ── Results ───────────────────────────────────────────────────────────────────
result_name_fg        = '#1e66f5'  # blue
result_line_number_fg = '#df8e1d'  # yellow
result_value_fg       = '#4c4f69'  # text
selection_fg          = '#4c4f69'  # text
selection_bg          = '#ccd0da'  # surface0  (subtle highlight on light bg)
match_fg              = '#d20f39'  # red

# ── Preview ───────────────────────────────────────────────────────────────────
preview_title_fg = '#179299'  # teal

# ── Mode pills ────────────────────────────────────────────────────────────────
channel_mode_fg         = '#eff1f5'  # base   (light text on coloured pill)
channel_mode_bg         = '#8839ef'  # mauve
remote_control_mode_fg  = '#eff1f5'  # base
remote_control_mode_bg  = '#40a02b'  # green
send_to_channel_mode_fg = '#04a5e5'  # sky
