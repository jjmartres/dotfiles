[metadata]
name = "gcloud-configs"
description = "List and switch gcloud CLI configurations"
requirements = [ "gcloud",]

[source]
command = "gcloud config configurations list --format='value(name,is_active,properties.core.project,properties.core.account)' 2>/dev/null"
display = "{split:\t:0}  [project={split:\t:2}  account={split:\t:3}]"
output = "{split:\t:0}"

[preview]
command = "gcloud config configurations describe '{split:\t:0}' 2>/dev/null"

[ui]
layout = "portrait"

[ui.preview_panel]
size = 50

[keybindings]
enter = "actions:activate"
ctrl-d = "actions:delete"

[actions.activate]
description = "Activate the selected configuration"
command = "gcloud config configurations activate '{split:\t:0}'"
mode = "execute"

[actions.delete]
description = "Delete the selected configuration"
command = "gcloud config configurations delete '{split:\t:0}'"
mode = "execute"
